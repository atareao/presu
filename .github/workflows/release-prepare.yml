name: Prepare Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-prepare
  cancel-in-progress: false

jobs:
  release:
    name: Bump version, changelog and tag
    # Skip the commit this workflow itself creates, to avoid an infinite loop.
    if: "!startsWith(github.event.head_commit.message, 'chore: release')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}

      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v2

      - name: Install git-cliff
        uses: taiki-e/install-action@v2
        with:
          tool: git-cliff

      - name: Install vampus
        run: cargo install vampus --git https://github.com/atareao/vampus

      - name: Determine bump type from commits
        id: bump
        run: |
          set -euo pipefail
          # `sed -n 1p` (not `head`) to avoid SIGPIPE under pipefail when no tag exists yet.
          last_tag="$(git describe --tags --abbrev=0 2>/dev/null || git rev-list --max-parents=0 HEAD | sed -n '1p')"
          commits="$(git log "${last_tag}..HEAD" --format="%s")"
          echo "Commits since ${last_tag}:"
          echo "${commits}"
          # Here-strings (not pipes) avoid SIGPIPE with `grep -q` under pipefail.
          if grep -qE 'BREAKING CHANGE|!:' <<< "${commits}"; then
            echo "type=--major" >> "$GITHUB_OUTPUT"
          elif grep -qE 'feat\(|feat:' <<< "${commits}"; then
            echo "type=--minor" >> "$GITHUB_OUTPUT"
          else
            echo "type=--patch" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump version with vampus
        run: vampus upgrade ${{ steps.bump.outputs.type }}

      - name: Read new version
        id: version
        run: |
          set -euo pipefail
          version="$(grep '^current_version' .vampus.yml | sed 's/.*: *//')"
          echo "value=${version}" >> "$GITHUB_OUTPUT"

      - name: Generate changelog
        run: git-cliff -o CHANGELOG.md --tag "v${{ steps.version.outputs.value }}"

      - name: Commit, tag and push
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.value }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: release v${version}"
          git tag "v${version}"
          git push origin main
          git push origin "v${version}"

      - name: Sync development with main
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh api -X PUT "repos/${{ github.repository }}/git/refs/heads/development" \
            -f sha="$(git rev-parse HEAD)"
