name: Prepare Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-prepare
  cancel-in-progress: false

jobs:
  release:
    name: Bump version, changelog and tag
    # Skip the commit this workflow itself creates, to avoid an infinite loop.
    if: "!startsWith(github.event.head_commit.message, 'chore: release')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}

      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v2

      - name: Install git-cliff
        uses: taiki-e/install-action@v2
        with:
          tool: git-cliff

      - name: Install vampus
        run: cargo install vampus --version 0.4.6 --locked

      - name: Determine bump type from commits
        id: bump
        run: |
          set -euo pipefail
          # `sed -n 1p` (not `head`) to avoid SIGPIPE under pipefail when no tag exists yet.
          last_tag="$(git describe --tags --abbrev=0 2>/dev/null || git rev-list --max-parents=0 HEAD | sed -n '1p')"
          commits="$(git log "${last_tag}..HEAD" --format="%s")"
          echo "Commits since ${last_tag}:"
          echo "${commits}"
          # Here-strings (not pipes) avoid SIGPIPE with `grep -q` under pipefail.
          if grep -qE 'BREAKING CHANGE|!:' <<< "${commits}"; then
            echo "type=--major" >> "$GITHUB_OUTPUT"
          elif grep -qE 'feat\(|feat:' <<< "${commits}"; then
            echo "type=--minor" >> "$GITHUB_OUTPUT"
          else
            echo "type=--patch" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump version with vampus
        id: bump_version
        run: |
          set -euo pipefail
          before="$(sed -n 's/^current_version: *//p' .vampus.yml)"
          vampus upgrade ${{ steps.bump.outputs.type }} 2>&1 | tee /tmp/vampus.log
          after="$(sed -n 's/^current_version: *//p' .vampus.yml)"
          # vampus sale con código 0 aunque aborte (p. ej. si un fichero de
          # `replaces` no existe, como pasó con el gitignored frontend/.env).
          # Detectamos el no-op comparando la versión antes y después.
          if [ "${after}" = "${before}" ]; then
            echo "::error::vampus no modificó la versión (sigue en ${before}); revisa .vampus.yml"
            cat /tmp/vampus.log
            exit 1
          fi
          echo "previous=${before}" >> "$GITHUB_OUTPUT"
          echo "value=${after}" >> "$GITHUB_OUTPUT"

      - name: Sync Cargo.lock with the new version
        run: |
          set -euo pipefail
          # vampus sube la versión en Cargo.toml pero no en Cargo.lock; el
          # Dockerfile compila con `--locked`, así que sin esto todo build
          # posterior a una release falla con "cannot update the lock file".
          cargo metadata --manifest-path backend/Cargo.toml --format-version 1 > /dev/null
          git diff --stat backend/Cargo.lock || true

      - name: Generate changelog
        run: git-cliff -o CHANGELOG.md --tag "v${{ steps.bump_version.outputs.value }}"

      - name: Commit, tag and push
        run: |
          set -euo pipefail
          version="${{ steps.bump_version.outputs.value }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: release v${version}"
          git tag "v${version}"
          git push origin main
          git push origin "v${version}"

      - name: Sync development with main
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh api -X PUT "repos/${{ github.repository }}/git/refs/heads/development" \
            -f sha="$(git rev-parse HEAD)"
