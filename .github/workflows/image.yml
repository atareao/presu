name: Image

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - "plans/**"
      - "docs/**"
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: Build, verify and publish image
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: presu
          POSTGRES_PASSWORD: presu
          POSTGRES_DB: presu
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U presu"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image without publishing
        uses: docker/build-push-action@v7
        with:
          push: false
          load: true
          tags: presu:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the built image
        run: |
          set -euo pipefail

          # Read the expected version straight from backend/Cargo.toml (never hardcoded).
          expected_version="$(sed -n 's/^version = "\(.*\)"$/\1/p' backend/Cargo.toml | head -n1)"
          if [ -z "${expected_version}" ]; then
            echo "::error::Could not read the version from backend/Cargo.toml"
            exit 1
          fi
          echo "Expected version (from backend/Cargo.toml): ${expected_version}"

          # The image needs a reachable PostgreSQL. The runner exposes the postgres
          # service on the host network, so the container joins it with --network host
          # and reaches the database at 127.0.0.1:5432. RUST_ENV=production makes the
          # binary look for the migrations at the executable's directory (/app/migrations).
          docker run -d --name presu-ci --network host \
            -e DATABASE_URL=postgres://presu:presu@127.0.0.1:5432/presu \
            -e RUST_ENV=production \
            presu:ci

          max_attempts=30
          body=""

          for attempt in $(seq 1 "${max_attempts}"); do
            echo "Health check attempt ${attempt}/${max_attempts}"
            for path in /api/v1/health /api/v1/health/; do
              http_code="$(curl -s -o /tmp/presu-health.json -w '%{http_code}' "http://127.0.0.1:3000${path}" || true)"
              body="$(cat /tmp/presu-health.json 2>/dev/null || true)"
              echo "GET ${path} -> HTTP ${http_code} - ${body}"
              if [ "${http_code}" = "200" ] \
                && printf '%s' "${body}" | jq -e '.status == 200 and .message == "Up and running"' > /dev/null 2>&1; then
                echo "Smoke test passed: status ok, message 'Up and running'"
                exit 0
              fi
            done
            sleep 2
          done

          echo "::error::Smoke test failed after ${max_attempts} attempts"
          docker logs presu-ci || true
          exit 1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag and publish the verified image
        env:
          IMAGE: ghcr.io/atareao/presu
        run: |
          set -euo pipefail

          short_sha="$(printf '%s' "${GITHUB_SHA}" | cut -c1-7)"
          tags=()

          case "${GITHUB_EVENT_NAME}" in
            workflow_dispatch)
              # A manual run may be triggered on any branch: publish only the
              # immutable sha tag and never move `latest`.
              tags=("sha-${short_sha}")
              ;;
            push)
              if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
                # Release tag vX.Y.Z -> vX.Y.Z, X.Y and latest.
                version="${GITHUB_REF_NAME}"
                if [[ ! "${version}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                  echo "::error::Unexpected release tag format: ${version}"
                  exit 1
                fi
                minor="${version%.*}"
                tags=("${version}" "${minor#v}" "latest")
              else
                # Push to main -> latest and the short-sha tag.
                tags=("latest" "sha-${short_sha}")
              fi
              ;;
            *)
              echo "::error::Unsupported event: ${GITHUB_EVENT_NAME}"
              exit 1
              ;;
          esac

          for tag in "${tags[@]}"; do
            docker tag presu:ci "${IMAGE}:${tag}"
          done

          for tag in "${tags[@]}"; do
            docker push "${IMAGE}:${tag}"
          done
